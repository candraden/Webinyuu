<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Daftar Order — Admin Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (komponen shared — edit di /partials/admin-sidebar.js) -->
  <script>window.AD_PAGE = 'orders';</script>
  <script src="../partials/admin-sidebar.js"></script>

  <!-- MAIN -->
  <main class="flex-1 min-h-screen min-w-0 bg-surface">
    <!-- HEADER (komponen shared — edit di /partials/admin-header.js) -->
    <script>
      window.AD_HEADER = {
        title: 'Daftar Order',
        subtitle: 'Pantau pesanan masuk, verifikasi pembayaran, dan kelola progres pengerjaan.'
      };
    </script>
    <script src="../partials/admin-header.js"></script>

    <div class="p-margin flex flex-col gap-space-lg">

      <!-- FILTER -->
      <div class="bg-surface-container-lowest rounded-2xl p-space-md sm:p-space-lg shadow-sm flex flex-col gap-space-md">
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="search">Cari Order</label>
          <input id="search" type="search" placeholder="Cari nama, usaha, nomor WA, atau nomor order" class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container">
        </div>
        <div id="status-chips" class="flex flex-wrap gap-space-xs"></div>
      </div>

      <div class="flex flex-col gap-space-md">
        <div id="state-loading" class="text-center text-body-md text-on-surface-variant py-space-xl">Memuat order...</div>
        <div id="state-empty" class="hidden text-center text-body-md text-on-surface-variant py-space-xl">Tidak ada order.</div>
        <div id="state-error" class="hidden bg-error/10 text-error rounded-xl px-space-md py-3 text-body-md"></div>
        <div id="orders-list" class="flex flex-col gap-space-sm"></div>
      </div>

    </div>
  </main>
</div>

<script type="module" src="../js/modules/adminOrders.js"></script>
</body>
</html>
