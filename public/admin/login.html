<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Login Admin — Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<main class="min-h-screen w-full flex items-center justify-center px-margin py-space-xl">
  <div class="w-full max-w-[420px] flex flex-col gap-space-lg">

    <div class="flex flex-col items-center gap-space-xs">
      <img alt="Webinyuu" class="h-14 w-auto object-contain" src="../assets/img/logo/webinyuu-vertikal.png">
      <span class="text-caption text-on-surface-variant uppercase tracking-wider font-bold">Admin Panel</span>
    </div>

    <form id="login-form" class="bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-md">
      <h1 class="text-headline-sm text-primary">Masuk</h1>

      <div id="login-error" class="hidden bg-error/10 text-error text-body-md rounded-xl px-space-md py-3"></div>

      <div class="flex flex-col gap-1">
        <label class="text-label-md text-primary" for="email">Email</label>
        <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="email" type="email" autocomplete="username" required>
      </div>

      <div class="flex flex-col gap-1">
        <label class="text-label-md text-primary" for="password">Password</label>
        <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="password" type="password" autocomplete="current-password" required>
      </div>

      <button id="btn-submit" class="mt-space-xs inline-flex items-center justify-center gap-space-xs bg-secondary-container text-primary-container text-label-md py-3 rounded-xl shadow-md hover:brightness-95 transition-all disabled:opacity-60" type="submit">
        Masuk
      </button>
    </form>

    <a class="text-center text-body-md text-on-surface-variant hover:text-on-surface transition-colors" href="/index.html">&larr; Kembali ke Beranda</a>
  </div>
</main>

<script type="module" src="../js/modules/adminLogin.js"></script>
</body>
</html>
