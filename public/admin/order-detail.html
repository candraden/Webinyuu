<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Detail Order — Admin Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (komponen shared — edit di /partials/admin-sidebar.js) -->
  <script>window.AD_PAGE = 'orders';</script>
  <script src="../partials/admin-sidebar.js"></script>

  <!-- MAIN -->
  <main class="flex-1 min-h-screen min-w-0 bg-surface">
    <!-- HEADER (komponen shared — edit di /partials/admin-header.js) -->
    <script>
      window.AD_HEADER = {
        title: 'Detail Order',
        subtitle: 'Pembayaran, file, revisi, dan riwayat status untuk satu order.',
        actionsHtml:
          '<a href="/admin/orders.html" class="inline-flex items-center gap-space-xs bg-secondary-container text-primary-container text-label-md px-space-md sm:px-space-lg py-3 rounded-xl shadow-sm hover:brightness-95 transition-all">' +
          '<span class="material-symbols-outlined text-[20px]">arrow_back</span>' +
          '<span class="hidden sm:inline">Semua Order</span>' +
          '</a>'
      };
    </script>
    <script src="../partials/admin-header.js"></script>

    <div class="p-margin flex flex-col gap-space-md">
      <div id="toast"></div>
      <div id="state-loading" class="text-center text-body-md text-on-surface-variant py-space-xl">Memuat order...</div>
      <div id="state-error" class="hidden bg-error/10 text-error rounded-xl px-space-md py-3 text-body-md"></div>
      <div id="detail" class="hidden flex flex-col gap-space-md"></div>
    </div>
  </main>
</div>

<script type="module" src="../js/modules/adminOrderDetail.js"></script>
</body>
</html>
