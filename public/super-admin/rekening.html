<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rekening Pembayaran — Super Admin Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
<link rel="stylesheet" href="../assets/css/pacman.css?v=20261014">
<link rel="stylesheet" href="../assets/css/sa-polish.css?v=20261023">
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (komponen shared — edit di /partials/sidebar.js) -->
  <script>window.SA_PAGE = 'rekening';</script>
  <script src="../partials/sidebar.js"></script>

  <!-- MAIN -->
  <main class="flex-1 min-h-screen min-w-0 bg-surface">
    <!-- HEADER (komponen shared — edit di /partials/header.js) -->
    <script>
      window.SA_HEADER = {
        title: 'Rekening Pembayaran',
        subtitle: 'Rekening tujuan transfer milik Webinyuu. Yang aktif tampil ke customer di halaman konfirmasi dan lacak pesanan.',
        actionsHtml:
          '<button id="btn-add-rek" class="inline-flex items-center gap-space-xs bg-secondary-container text-primary-container text-label-md px-space-md sm:px-space-lg py-3 rounded-xl shadow-sm hover:brightness-95 transition-all" type="button">' +
          '<span class="material-symbols-outlined text-[20px]">add</span>' +
          '<span class="hidden sm:inline">Tambah Rekening</span>' +
          '</button>'
      };
    </script>
    <script src="../partials/header.js"></script>

    <div class="p-margin flex flex-col gap-space-md">
      <div id="flash" class="hidden"></div>
      <div id="state-loading" class="text-center text-body-md text-on-surface-variant py-space-xl">Memuat rekening...</div>
      <div id="state-empty" class="hidden text-center text-body-md text-on-surface-variant py-space-xl">Belum ada rekening. Klik "Tambah Rekening" agar customer tahu ke mana harus transfer.</div>
      <div id="state-error" class="hidden text-center text-body-md text-error py-space-xl"></div>

      <div id="rek-table-wrap" class="hidden bg-surface-container-lowest rounded-2xl shadow-sm overflow-x-auto -mx-margin sm:mx-0">
        <table class="w-full text-body-md min-w-[640px]">
          <thead>
            <tr class="text-left text-label-md text-on-surface-variant border-b border-outline-variant/30">
              <th class="px-space-md py-space-sm">Bank / E-wallet</th>
              <th class="px-space-md py-space-sm">Nomor</th>
              <th class="px-space-md py-space-sm">Atas Nama</th>
              <th class="px-space-md py-space-sm">Status</th>
              <th class="px-space-md py-space-sm">Aksi</th>
            </tr>
          </thead>
          <tbody id="rek-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL FORM REKENING -->
<div id="modal-rek" class="hidden fixed inset-0 z-50 bg-tertiary/40 backdrop-blur-sm flex items-center justify-center sm:p-margin">
  <form id="form-rek" class="w-full h-full sm:h-auto sm:max-w-[480px] sm:max-h-[90vh] overflow-y-auto bg-surface-container-lowest rounded-none sm:rounded-2xl shadow-xl p-space-md sm:p-space-lg flex flex-col gap-space-md">
    <h2 id="modal-rek-title" class="text-headline-sm text-primary">Tambah Rekening</h2>
    <input type="hidden" id="rek-id">

    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="rek-bank">Bank / E-wallet *</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="rek-bank" type="text" maxlength="60" placeholder="Contoh: BCA, BRI, DANA" required>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="rek-number">Nomor Rekening / HP *</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="rek-number" type="text" inputmode="numeric" maxlength="40" placeholder="Hanya angka" required>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="rek-holder">Atas Nama *</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="rek-holder" type="text" maxlength="80" required>
    </div>
    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="rek-sort">Urutan Tampil</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="rek-sort" type="number" value="0">
    </div>
    <label class="flex items-center gap-space-xs text-body-md">
      <input class="w-5 h-5 rounded" id="rek-active" type="checkbox" checked>
      Aktif (tampil ke customer)
    </label>

    <div id="rek-form-error" class="hidden bg-error/10 text-error text-body-md rounded-xl px-space-md py-3"></div>

    <div class="flex items-center justify-end gap-space-sm pt-space-xs sticky bottom-0 bg-surface-container-lowest pb-space-xs sm:pb-0">
      <button id="btn-cancel-rek" class="inline-flex items-center justify-center bg-surface-container text-primary text-label-md px-space-lg py-3 rounded-xl" type="button">Batal</button>
      <button id="btn-save-rek" class="inline-flex items-center justify-center bg-secondary-container text-primary-container text-label-md px-space-lg py-3 rounded-xl shadow-md hover:brightness-95 transition-all" type="submit">Simpan</button>
    </div>
  </form>
</div>

<script type="module" src="../js/modules/superAdminRekening.js"></script>
<script src="../js/sa-polish.js?v=20261023"></script>
</body>
</html>
