<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kelola Kategori — Super Admin Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (komponen shared — edit di /partials/sidebar.js) -->
  <script>window.SA_PAGE = 'kategori';</script>
  <script src="../partials/sidebar.js"></script>

  <!-- MAIN -->
  <main class="flex-1 min-h-screen min-w-0 bg-surface">
    <!-- HEADER (komponen shared — edit di /partials/header.js) -->
    <script>
      window.SA_HEADER = {
        title: 'Kelola Kategori',
        subtitle: 'Kategori dipakai untuk mengelompokkan paket di katalog publik.',
        actionsHtml:
          '<button id="btn-add-kategori" class="inline-flex items-center gap-space-xs bg-secondary-container text-primary-container text-label-md px-space-md sm:px-space-lg py-3 rounded-xl shadow-sm hover:brightness-95 transition-all" type="button">' +
          '<span class="material-symbols-outlined text-[20px]">add</span>' +
          '<span class="hidden sm:inline">Tambah Kategori</span>' +
          '</button>'
      };
    </script>
    <script src="../partials/header.js"></script>

    <div class="p-margin flex flex-col gap-space-md">
      <div id="state-loading" class="text-center text-body-md text-on-surface-variant py-space-xl">Memuat kategori...</div>
      <div id="state-empty" class="hidden text-center text-body-md text-on-surface-variant py-space-xl">Belum ada kategori. Klik "Tambah Kategori" untuk membuat yang pertama.</div>
      <div id="state-error" class="hidden text-center text-body-md text-error py-space-xl"></div>

      <div id="kategori-table-wrap" class="hidden bg-surface-container-lowest rounded-2xl shadow-sm overflow-x-auto -mx-margin sm:mx-0">
        <table class="w-full text-body-md min-w-[560px]">
          <thead>
            <tr class="text-left text-label-md text-on-surface-variant border-b border-outline-variant/30">
              <th class="px-space-md py-space-sm">Urutan</th>
              <th class="px-space-md py-space-sm">Nama</th>
              <th class="px-space-md py-space-sm">Slug</th>
              <th class="px-space-md py-space-sm">Status</th>
              <th class="px-space-md py-space-sm">Aksi</th>
            </tr>
          </thead>
          <tbody id="kategori-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<!-- MODAL FORM KATEGORI -->
<div id="modal-kategori" class="hidden fixed inset-0 z-50 bg-tertiary/40 backdrop-blur-sm flex items-center justify-center sm:p-margin">
  <form id="form-kategori" class="w-full h-full sm:h-auto sm:max-w-[480px] sm:max-h-[90vh] overflow-y-auto bg-surface-container-lowest rounded-none sm:rounded-2xl shadow-xl p-space-md sm:p-space-lg flex flex-col gap-space-md">
    <h2 id="modal-kategori-title" class="text-headline-sm text-primary">Tambah Kategori</h2>
    <input type="hidden" id="kategori-id">

    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="kategori-name">Nama Kategori *</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="kategori-name" type="text" required>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="kategori-slug">Slug *</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="kategori-slug" type="text" required>
      <p class="text-caption text-on-surface-variant">Dipakai di URL, huruf kecil & tanda "-" saja. Contoh: landing-page</p>
    </div>

    <div class="flex flex-col gap-1">
      <label class="text-label-md text-primary" for="kategori-sort">Urutan Tampil</label>
      <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="kategori-sort" type="number" value="0">
    </div>

    <label class="flex items-center gap-space-xs text-body-md">
      <input class="w-5 h-5 rounded" id="kategori-active" type="checkbox" checked>
      Aktif (tampil di katalog publik)
    </label>

    <div id="kategori-form-error" class="hidden bg-error/10 text-error text-body-md rounded-xl px-space-md py-3"></div>

    <div class="flex items-center justify-end gap-space-sm pt-space-xs sticky bottom-0 bg-surface-container-lowest pb-space-xs sm:pb-0">
      <button id="btn-cancel-kategori" class="inline-flex items-center justify-center bg-surface-container text-primary text-label-md px-space-lg py-3 rounded-xl" type="button">Batal</button>
      <button id="btn-save-kategori" class="inline-flex items-center justify-center bg-secondary-container text-primary-container text-label-md px-space-lg py-3 rounded-xl shadow-md hover:brightness-95 transition-all" type="submit">Simpan</button>
    </div>
  </form>
</div>

<script type="module" src="../js/modules/superAdminCatalog.js" data-page="kategori"></script>
</body>
</html>
