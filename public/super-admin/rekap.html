<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Rekap Penjualan — Super Admin Webinyuu</title>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="../assets/js/tailwind.config.js"></script>
</head>
<body class="bg-surface font-sans text-on-surface antialiased">

<div class="flex min-h-screen w-full">

  <!-- SIDEBAR (komponen shared — edit di /partials/sidebar.js) -->
  <script>window.SA_PAGE = 'rekap';</script>
  <script src="../partials/sidebar.js"></script>

  <!-- MAIN -->
  <main class="flex-1 min-h-screen min-w-0 bg-surface">
    <!-- HEADER (komponen shared — edit di /partials/header.js) -->
    <script>
      window.SA_HEADER = {
        title: 'Rekap Penjualan',
        subtitle: 'Ringkasan order &amp; pendapatan, bisa difilter periode/paket/admin/status.',
        actionsHtml: ''
      };
    </script>
    <script src="../partials/header.js"></script>

    <div class="p-margin flex flex-col gap-space-lg">

      <!-- FILTER -->
      <form id="filter-form" class="bg-surface-container-lowest rounded-2xl p-space-md sm:p-space-lg shadow-sm grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-space-md items-end">
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="filter-dari">Dari Tanggal</label>
          <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="filter-dari" type="date">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="filter-sampai">Sampai Tanggal</label>
          <input class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container" id="filter-sampai" type="date">
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="filter-produk">Paket</label>
          <select class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container bg-surface-container-lowest" id="filter-produk">
            <option value="">Semua Paket</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="filter-admin">Admin</label>
          <select class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container bg-surface-container-lowest" id="filter-admin">
            <option value="">Semua Admin</option>
          </select>
        </div>
        <div class="flex flex-col gap-1">
          <label class="text-label-md text-primary" for="filter-status">Status</label>
          <select class="border border-outline-variant rounded-xl px-space-md py-3 text-base sm:text-body-md focus:outline-none focus:ring-2 focus:ring-secondary-container bg-surface-container-lowest" id="filter-status">
            <option value="">Semua Status</option>
          </select>
        </div>
        <div class="col-span-1 sm:col-span-2 md:col-span-5 flex items-center gap-space-sm">
          <button id="btn-apply-filter" class="inline-flex items-center justify-center bg-secondary-container text-primary-container text-label-md px-space-lg py-3 rounded-xl shadow-sm hover:brightness-95 transition-all" type="submit">Terapkan Filter</button>
          <button id="btn-reset-filter" class="inline-flex items-center justify-center bg-surface-container text-primary text-label-md px-space-lg py-3 rounded-xl" type="button">Reset</button>
        </div>
      </form>

      <!-- SUMMARY CARDS -->
      <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-space-md">
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1">
          <span class="text-caption text-on-surface-variant">Total Order</span>
          <span id="stat-total" class="text-headline-md text-primary">0</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1">
          <span class="text-caption text-on-surface-variant">Sedang Berjalan</span>
          <span id="stat-berjalan" class="text-headline-md text-primary">0</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1">
          <span class="text-caption text-on-surface-variant">Selesai</span>
          <span id="stat-selesai" class="text-headline-md text-primary">0</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1">
          <span class="text-caption text-on-surface-variant">Dibatalkan</span>
          <span id="stat-batal" class="text-headline-md text-primary">0</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1 col-span-2 sm:col-span-1">
          <span class="text-caption text-on-surface-variant">Total Pendapatan (Diterima)</span>
          <span id="stat-pendapatan" class="text-headline-sm text-secondary font-bold">Rp0</span>
        </div>
        <div class="bg-surface-container-lowest rounded-2xl p-space-md shadow-sm flex flex-col gap-1 col-span-2 sm:col-span-1">
          <span class="text-caption text-on-surface-variant">Total Tip</span>
          <span id="stat-tip" class="text-headline-sm text-secondary font-bold">Rp0</span>
        </div>
      </div>

      <!-- TABLE -->
      <div id="state-loading" class="text-center text-body-md text-on-surface-variant py-space-xl">Memuat data rekap...</div>
      <div id="state-empty" class="hidden text-center text-body-md text-on-surface-variant py-space-xl">Tidak ada order yang cocok dengan filter ini.</div>
      <div id="state-error" class="hidden text-center text-body-md text-error py-space-xl"></div>

      <div id="rekap-table-wrap" class="hidden bg-surface-container-lowest rounded-2xl shadow-sm overflow-x-auto -mx-margin sm:mx-0">
        <table class="w-full text-body-md min-w-[960px]">
          <thead>
            <tr class="text-left text-label-md text-on-surface-variant border-b border-outline-variant/30">
              <th class="px-space-md py-space-sm">No. Order</th>
              <th class="px-space-md py-space-sm">Customer</th>
              <th class="px-space-md py-space-sm">Paket</th>
              <th class="px-space-md py-space-sm">Admin</th>
              <th class="px-space-md py-space-sm">Status</th>
              <th class="px-space-md py-space-sm text-right">Total</th>
              <th class="px-space-md py-space-sm text-right">Diterima</th>
              <th class="px-space-md py-space-sm">Tgl Dibuat</th>
              <th class="px-space-md py-space-sm">Tgl Selesai</th>
            </tr>
          </thead>
          <tbody id="rekap-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module" src="../js/modules/superAdminRekap.js"></script>
</body>
</html>
